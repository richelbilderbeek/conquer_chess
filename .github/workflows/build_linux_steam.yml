name: Build Linux (Steam Runtime 3 Sniper)

on:
  workflow_dispatch:  # allows manual trigger
  push:
    branches:
      - main
  pull_request:

jobs:
  build-linux-steam:
    runs-on: ubuntu-latest

    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake g++ make git \
            libx11-dev libxrandr-dev libxi-dev libudev-dev \
            libgl1-mesa-dev libopenal-dev libvorbis-dev libflac-dev

      - name: Install SFML 2.6.1
        run: |
          git clone --branch 2.6.1 https://github.com/SFML/SFML.git
          cd SFML
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build --target install -j$(nproc)

      - name: Build project
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DSFML_DIR=/usr/local/lib/cmake/SFML
          make -j$(nproc)

      - name: Package build
        run: |
          cd build
          tar -czvf conquer_chess_linux_steam.tar.gz conquer_chess
          mv conquer_chess_linux_steam.tar.gz $GITHUB_WORKSPACE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: conquer_chess_linux_steam
          path: conquer_chess_linux_steam.tar.gz

