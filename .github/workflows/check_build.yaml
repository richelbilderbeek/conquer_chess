# Check that the program can be built
name: Check build

# Check links on the 3rd day of the month.
# 3rd as the first letter of this repo is the 3rd letter in the alphabet.
on:
  push:
    paths:
      - .github/workflows/check_build.yaml
      - "**.cpp"
      - "**.h"
      - "**.pro"
      - "**.pri"
      - "resources/**"
      - "scripts/get_codecov.sh"
  pull_request:
    paths:
      - .github/workflows/check_build.yaml
      - "**.cpp"
      - "**.h"
      - "**.pro"
      - "**.pri"
      - "resources/**"
      - "scripts/get_codecov.sh"

jobs:
  check_build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4

      - name: Install SFML 3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libfreetype-dev libflac-dev libvorbis-dev

      - name: Build and install SFML 3
        run: |
          git clone --depth 1 --branch 3.0.2 https://github.com/SFML/SFML.git /tmp/SFML
          cmake -S /tmp/SFML -B /tmp/SFML/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/SFML/build -j$(nproc)
          sudo cmake --install /tmp/SFML/build
          sudo ldconfig

      - name: Install Codecov
        run: sudo pip install codecov

      - name: Download magic_enum
        run: |
          cd ..
          git clone https://github.com/Neargye/magic_enum --branch v0.9.7
          cd -

      - name: Download Disservin's chess library
        run: |
          cd ..
          git clone https://github.com/Disservin/chess-library.git
          cd -

      # From https://github.com/jerr-it/SFGraphing
      - name: Download Jerrit Gläsker's SFGraphing library
        run: |
          cd ..
          git clone https://github.com/richelbilderbeek/SFGraphing -b patch-1
          cd -

      # Until richelbilderbeek/SFGraphing has the SFML 3 port
      - name: Port SFGraphing to SFML 3, if needed
        run: ./patches/sfgraphing/apply_patch.sh ../SFGraphing

      - name: qmake
        run: qmake "DEFINES+=LOGIC_ONLY" game.pro

      - name: make
        run: make debug

      - name: Run tests
        run: ./conquer_chess --test

      - name: Show help
        run: ./conquer_chess --help

      - name: Measure codecov 1
        run: ./scripts/get_code_cov.sh

      - name: Measure codecov 2
        run: codecov

      - name: Measure codecov 3
        run: bash <(curl -s https://codecov.io/bash)

      - name: play a standard random game
        run: ./conquer_chess --play_standard_random_game

      - name: clean for release build
        run: make clean

      - name: qmake
        run: qmake game.pro

      - name: make
        run: make release --silent
